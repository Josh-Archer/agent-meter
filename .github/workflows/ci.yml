name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared' }}
    steps:
      - name: Ensure base toolchain (uecb-shared image lacks it)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Stopgap until ghcr.io/josh-archer/shared-runner (home gitops/images/shared-runner) is published and pinned.
          missing=""
          for t in make gcc g++ ruby wget pkg-config; do command -v "$t" >/dev/null 2>&1 || missing="$missing $t"; done
          if [ -n "$missing" ] && command -v apt-get >/dev/null 2>&1; then
            echo "Installing missing tools:$missing"
            SUDO=""; [ "$(id -u)" = 0 ] || SUDO=sudo
            $SUDO apt-get update -qq
            $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends build-essential pkg-config ruby wget ca-certificates
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Install build and packaging dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-4-dev pkg-config dpkg-dev gnupg gpgv
      - name: Run Python and packaging checks
        run: |
          python3 tests/check-extension-layout.py
          python3 tests/test-adapters.py
          python3 tests/test-apt-repo.py
      - name: Run Rust tests
        run: cargo test --all-features
