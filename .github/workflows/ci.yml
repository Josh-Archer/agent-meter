name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      - name: Install build and packaging dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-4-dev pkg-config dpkg-dev gnupg gpgv
      - name: Run Python and packaging checks
        run: |
          python3 tests/check-extension-layout.py
          python3 tests/test-adapters.py
          python3 tests/test-apt-repo.py
      - name: Run Rust tests
        run: cargo test --all-features
