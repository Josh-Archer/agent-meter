name: Auto release

# Every merge to main whose CI passes is released: this sets the package version in Cargo.toml and Cargo.lock to the next version (scripts/next-release-version.sh) in a commit on main, tags it and starts release.yml on that tag.
# A tag pushed with GITHUB_TOKEN does not trigger other workflows, so
# release.yml is started explicitly. Docs, CI and test-only
# merges are not released.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and release
    # Only the main-branch CI runs of this repository, never pull requests or
    # forks.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Work out the next version
        id: version
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(scripts/next-release-version.sh "${SHA}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ -z "${version}" ]]; then
            echo "No release needed for ${SHA}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag
        if: steps.version.outputs.version != ''
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # Only the tip of main is released: if main moved on, the newer
          # commit's run releases this change too.
          git fetch --quiet origin main
          if [[ "$(git rev-parse origin/main)" != "${SHA}" ]]; then
            echo "main moved past ${SHA}; its newer commit will be released." >> "$GITHUB_STEP_SUMMARY"
            echo "tagged=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | awk 'NR == 1')"
          summary="$(git log -n 20 --format='%s' "${base}..${SHA}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Cargo.toml and Cargo.lock carry the package version, so the bump
          # lands on main first and the tag points at it.
          sed -i -E '0,/^version = "[^"]*"/s//version = "'"${VERSION#v}"'"/' Cargo.toml
          sed -i -E '/^name = "agent-meter"$/{n;s/^version = "[^"]*"/version = "'"${VERSION#v}"'"/}' Cargo.lock
          if ! git diff --quiet -- Cargo.toml Cargo.lock; then
            git commit --quiet -m "chore(release): ${VERSION#v}" -- Cargo.toml Cargo.lock
            # Fast-forward only: fails cleanly if main moved meanwhile.
            git push origin HEAD:refs/heads/main
          fi
          git tag -a "${VERSION}" HEAD -m "${VERSION}" -m "${summary}"
          git push origin "refs/tags/${VERSION}"
          echo "tagged=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tagged $(git rev-parse --short HEAD) as ${VERSION}." >> "$GITHUB_STEP_SUMMARY"

      - name: Start the release
        if: steps.tag.outputs.tagged != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.tag.outputs.tagged }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "${GITHUB_REPOSITORY}" --ref "${VERSION}" \
            -f version="${VERSION#v}"
          echo "Started release.yml for ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
