name: Ubuntu release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-4-dev pkg-config dpkg-dev
      - name: Resolve version
        id: version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${TAG_VERSION#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Run validation
        run: |
          python3 tests/check-extension-layout.py
          python3 tests/test-adapters.py
          cargo test --all-features
      - name: Build release packages
        run: ./packaging/build-release.sh "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v7.0.0
        with:
          name: release-dist
          path: dist/*
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*

  publish-apt-repo:
    name: Publish APT repository
    needs: package
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install packaging dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y dpkg-dev gnupg gpgv gh
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v7.0.0
        with:
          name: release-dist
          path: dist
      - name: Collect historical release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/pool-staging
          # Copy newly built packages
          cp dist/*.deb dist/pool-staging/ 2>/dev/null || true
          # Download historical releases if any exist
          releases=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || true)
          for tag in $releases; do
            gh release download "$tag" --pattern "*.deb" --dir dist/pool-staging --clobber 2>/dev/null || true
          done
      - name: Generate and sign APT repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
        run: |
          ./packaging/generate-apt-repo.sh dist/pool-staging dist/apt-repo amd64
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist/apt-repo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
