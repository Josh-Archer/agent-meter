name: Ubuntu release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-30
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libgtk-4-dev pkg-config dpkg-dev
      - name: Resolve version
        id: version
        env:
          TAG_VERSION: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${TAG_VERSION#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Run validation
        run: |
          python3 tests/check-extension-layout.py
          python3 tests/test-adapters.py
          cargo test --all-features
      - name: Build release packages
        run: ./packaging/build-release.sh "${{ steps.version.outputs.value }}"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          files: dist/*
